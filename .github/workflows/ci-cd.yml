name: CI/CD Pipeline & GHCR Delivery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  # ==============================================================================
  # 1. BACKEND TESTLERİ (Pytest Unit & Integration Tests)
  # ==============================================================================
  backend-tests:
    name: 🐍 Backend Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Python Bağımlılıklarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Pytest Testlerini Koştur (48 Test)
        env:
          DB_TYPE: sqlite
        run: |
          python -m pytest -v

  # ==============================================================================
  # 2. FRONTEND DERLEME VE TİP DENETİMİ (React + TypeScript + Vite)
  # ==============================================================================
  frontend-build:
    name: ⚛️ Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Node.js Bağımlılıklarını Yükle
        working-directory: frontend
        run: npm ci

      - name: 🔨 TypeScript Tip Kontrolü ve Vite Derlemesi
        working-directory: frontend
        run: npm run build

  # ==============================================================================
  # 3. GÜVENLİ DAĞITIM & GHCR DOCKER PAKETLEME (Quality Gate & GHCR Push)
  # Yalnızca backend-tests VE frontend-build %100 başarılı olursa çalışır!
  # Testler geçerse Docker imajını derleyip GitHub Container Registry'ye (ghcr.io) yükler.
  # ==============================================================================
  deploy-to-ghcr:
    name: 🐳 Docker Build & Push to GHCR
    needs: [backend-tests, frontend-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: 🔑 GitHub Container Registry'ye (GHCR) Giriş Yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker Etiket ve Metadata Hazırlığı
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Docker İmajını Derle ve GHCR'ye Gönder (Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Başarı Bildirimi
        run: |
          echo "========================================================"
          echo "🎉 DOCKER İMAJI BAŞARIYLA GHCR'YE YÜKLENDİ!"
          echo "📦 İmaj Adresi: ghcr.io/${{ github.repository }}:latest"
          echo "========================================================"
