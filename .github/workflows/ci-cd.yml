name: CI/CD Pipeline & Fullstack VPS Delivery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  # ==============================================================================
  # 1. BACKEND TESTLERİ (Pytest Unit & Integration Tests)
  # ==============================================================================
  backend-tests:
    name: 🐍 Backend Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Python Bağımlılıklarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Pytest Testlerini Koştur (48 Test)
        env:
          DB_TYPE: sqlite
        run: |
          python -m pytest -v

  # ==============================================================================
  # 2. FRONTEND DERLEME VE TİP DENETİMİ (React + TypeScript + Vite)
  # ==============================================================================
  frontend-build:
    name: ⚛️ Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Node.js Bağımlılıklarını Yükle
        working-directory: frontend
        run: npm ci

      - name: 🔨 TypeScript Tip Kontrolü ve Vite Derlemesi
        working-directory: frontend
        run: npm run build

  # ==============================================================================
  # 3. DOCKER PAKETLEME VE GHCR YÜKLEME (Backend + Frontend)
  # ==============================================================================
  deploy-to-ghcr:
    name: 🐳 Build & Push Docker Images to GHCR
    needs: [backend-tests, frontend-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: 🔑 GitHub Container Registry'ye (GHCR) Giriş Yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3A: Backend API İmajı ---
      - name: 🏷️ Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Backend İmajını Derle ve GHCR'ye Yükle
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 3B: Frontend Dashboard İmajı ---
      - name: 🏷️ Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Frontend İmajını Derle ve GHCR'ye Yükle
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # 4. ORACLE VPS CANLIYA ALMA (Fullstack Automated SSH Deployment)
  # ==============================================================================
  deploy-to-vps:
    name: 🚀 Deploy Fullstack to Oracle VPS
    needs: [deploy-to-ghcr]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 SSH ile Sunucuya Bağlan ve Konteynerleri Güncelle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ secrets.WORK_DIR }}
            cd ${{ secrets.WORK_DIR }}
            echo "📥 Yeni Docker İmajları Çekiliyor (Backend & Frontend)..."
            sudo docker compose pull || docker compose pull || true
            echo "🚀 Konteynerler Başlatılıyor..."
            sudo docker compose up -d || docker compose up -d
            echo "✅ Fullstack Canlıya Dağıtım (Deploy) Başarıyla Tamamlandı!"
