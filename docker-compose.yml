version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proje_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proje_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: proje_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    image: ghcr.io/erenalbayrakk04/projeapi:latest
    container_name: proje_api
    restart: always
    environment:
      DB_TYPE: ${DB_TYPE:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-proje_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    image: ghcr.io/erenalbayrakk04/projeapi-frontend:latest
    container_name: proje_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: