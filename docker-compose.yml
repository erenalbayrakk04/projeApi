services:
  # ============================================================================
  # 1. PostgreSQL Veritabanı Servisi (Official PostgreSQL 16 Alpine Image)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: proje_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. FastAPI Backend Servisi (projeApi)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/erenalbayrakk04/projeapi:latest
    container_name: proje_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_TYPE: ${DB_TYPE}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # 3. React Frontend Servisi (projeApi Dashboard)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/erenalbayrakk04/projeapi-frontend:latest
    container_name: proje_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

# ==============================================================================
# Kalıcı Veri Alanı (Named Volume)
# ==============================================================================
volumes:
  postgres_data:
    driver: local
